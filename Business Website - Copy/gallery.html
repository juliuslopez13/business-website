<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Panggako's Catering</title>
    <link rel="stylesheet" href="index.css">
    <style>
        @media (max-width: 768px) {
            .gallery-container {
            grid-template-columns: repeat(2, 1fr);
            }
            .modal-gallery {
            grid-template-columns: repeat(2, 1fr);
            }
            .filter-buttons {
            flex-wrap: wrap;
            }
            .filter-btn {
            font-size: 12px;
            padding: 8px 12px;
            }
        }

        @media (max-width: 480px) {
            .gallery-container {
            grid-template-columns: 1fr;
            }
            .modal-gallery {
            grid-template-columns: 1fr;
            }
        }
            .gallery-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding-bottom: 150px;
            width: 100%;
        }

        .gallery-item {
            cursor: pointer;
            overflow: hidden;
            border-radius: 8px;
        }

        .gallery-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item img:hover {
            transform: scale(1.05);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.9);
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 10px;
        }

        .modal-gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 5px;
        }

        .close-modal {
            position: fixed;
            top: 20px;
            right: 30px;
            font-size: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            z-index: 1001;
        }

        .close-modal:hover {
            color: #ccc;
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #8b7355;
            background-color: transparent;
            color: #8b7355;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .filter-btn.active {
            background-color: #8b7355;
            color: white;
        }

        .filter-btn:hover {
            background-color: #8b7355;
            color: white;
        }

        .fixed-buttons {
            position: fixed;
            bottom: 10px;
            left: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .gallery-item.hidden {
            display: none;
        }
    </style>
</head>

    <script src="script.js"></script>
    <script>
        function openModal() {
            document.getElementById('galleryModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('galleryModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function filterCategory(category) {
            const items = document.querySelectorAll('.gallery-item');
            const buttons = document.querySelectorAll('.filter-btn');
            
            items.forEach(item => {
                if (item.getAttribute('data-category') === category) {
                    item.classList.remove('hidden');
                } else {
                    item.classList.add('hidden');
                }
            });

            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        document.getElementById('galleryModal').addEventListener('click', function(event) {
            if (event.target === this) {
                closeModal();
            }
        });
    </script>
